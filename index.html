const safeDate=iso=>/^\d{4}-\d\d-\d\d$/.test(iso||'')&&!Number.isNaN(new Date(iso+'T12:00:00').valueOf());
const deepEqual=(a,b)=>JSON.stringify(a)===JSON.stringify(b);

let db=clone(SEED),page='budget',month=localToday().slice(0,7),selected=localToday(),showArchived=false,storageOK=false,dirty=false;
function toast(msg,bad=false){let n=$('toast');n.textContent=msg;n.className=bad?'bad':'';n.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.hidden=true,5000)}
function save(){dirty=true;try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;dirty=false;}catch(e){storageOK=false;}updateStorage();}
function updateStorage(){$('storage').textContent=storageOK?'Saved in browser · Export backups regularly':'Temporary preview · Export backup before closing';$('storage').className=storageOK?'subtle':'warn'}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){let x=JSON.parse(raw);if(x.version===10&&Array.isArray(x.paydays)&&x.work&&Array.isArray(x.transactions)){db=x;storageOK=true;}}else{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;}}catch(e){storageOK=false}updateStorage();}
function download(name,blob){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);toast('Download requested. Check Chrome Downloads.');}
function exportBackup(){download('my-budget-v10-full-backup-'+localToday()+'.json',new Blob([JSON.stringify(db,null,2)],{type:'application/json'}))}
function validateImport(o){if(!o||o.version!==10||!Array.isArray(o.paydays)||!Array.isArray(o.transactions)||!Array.isArray(o.savings)||!Array.isArray(o.debts)||!o.work||!Array.isArray(o.work.days)||!Array.isArray(o.work.settings))throw Error('Not a complete V10 full-app backup. No data changed.');return o;}
async function importBackup(file){if(!file)return;try{if(file.size>10e6)throw Error('File too large');let x=validateImport(JSON.parse(await file.text()));if(!confirm('Replace this test app’s current data with the selected backup? Your original V9 app is not affected.'))return;db=x;save();render();toast('Backup restored');}catch(e){toast('Import failed: '+e.message,true)}}
const byId=id=>db.paydays.find(p=>p.id===id);
const expenseTotal=p=>p.expenses.filter(e=>!e.archived&&e.status!=='skipped').reduce((s,e)=>s+e.amountCents,0);
const planned=p=>p.incomeCents-expenseTotal(p)-cents(p.legacyVet)-cents(p.legacyOther);
function statusSelect(status,attr){return `<select ${attr}>${['unpaid','paid','skipped'].map(s=>`<option ${status===s?'selected':''} value="${s}">${s}</option>`).join('')}</select>`}
function budget(){let active=db.paydays.filter(p=>showArchived||!p.archived).sort((a,b)=>(a.isoDate||'9999').localeCompare(b.isoDate||'9999'));return `<section class="stats"><div class="stat"><small>Paydays</small><strong>${db.paydays.filter(p=>!p.archived).length}</strong></div><div class="stat"><small>Expenses</small><strong>${db.paydays.reduce((s,p)=>s+p.expenses.filter(e=>!e.archived).length,0)}</strong></div><div class="stat"><small>Planned income</small><strong>${fmt(db.paydays.filter(p=>!p.archived).reduce((s,p)=>s+p.incomeCents,0))}</strong></div><div class="stat"><small>Planned remainder</small><strong>${fmt(db.paydays.filter(p=>!p.archived).reduce((s,p)=>s+planned(p),0))}</strong></div></section><div class="toolbar"><button data-act="addPayday">+ Payday</button><button data-act="toggleArchive">${showArchived?'Hide archived':'Show archived'}</button></div>${active.map(p=>`<details class="card" data-payid="${p.id}" ${p.isoDate>=localToday()&&!p.archived?'open':''}><summary><span>${esc(p.label)} ${p.archived?'(Archived)':''}<small>${p.isoDate||'Date needed'} · ${fmt(p.incomeCents)} income</small></span><b>${fmt(p.actualAvailableCents==null?planned(p):p.actualAvailableCents)}</b></summary><div class="inner"><div class="fields"><label>Payday name<input data-kind="pay" data-id="${p.id}" data-field="label" value="${esc(p.label)}"></label><label>Payday date<input type="date" data-kind="pay" data-id="${p.id}" data-field="isoDate" value="${esc(p.isoDate||'')}"></label><label>Take-home income${moneyField(p.incomeCents,`data-kind="pay" data-id="${p.id}" data-field="incomeCents"`)}</label><label>Actual available (optional)<input type="number" step="0.01" placeholder="No override" data-kind="pay" data-id="${p.id}" data-field="actualAvailableCents" value="${p.actualAvailableCents==null?'':dollars(p.actualAvailableCents)}"></label></div><label class="check"><input type="checkbox" data-kind="pay" data-id="${p.id}" data-field="completed" ${p.completed?'checked':''}> Payday completed</label><p class="subtle">Calculated remainder: <b>${fmt(planned(p))}</b> · Difference from override: <b>${p.actualAvailableCents==null?'—':fmt(p.actualAvailableCents-planned(p))}</b></p>${p.legacyAdjustment?`<p class="warn">V9 adjustment ${fmt(cents(p.legacyAdjustment))} preserved for review, not applied twice.</p>`:''}${p.legacyVet?`<p class="warn">V9 savings allocation ${fmt(cents(p.legacyVet))} included in planned remainder, not counted as deposited savings.</p>`:''}<h3>Expenses</h3>${p.expenses.filter(e=>showArchived||!e.archived).map(e=>`<div class="expense ${e.status==='skipped'?'skipped':''}"><input aria-label="Expense name" data-kind="expense" data-pay="${p.id}" data-id="${e.id}" data-field="name" value="${esc(e.name)}"><input aria-label="Amount" type="number" step="0.01" data-kind="expense" data-pay="${p.id}" data-id="${e.id}" data-field="amountCents" value="${dollars(e.amountCents)}">${statusSelect(e.status,`data-kind="expense" data-pay="${p.id}" data-id="${e.id}" data-field="status"`)}<input aria-label="Due date" type="date" data-kind="expense" data-pay="${p.id}" data-id="${e.id}" data-field="dueDate" value="${esc(e.dueDate||'')}"><button class="tiny" data-act="archiveExpense" data-pay="${p.id}" data-id="${e.id}">${e.archived?'Restore':'Archive'}</button></div>`).join('')}<div class="toolbar"><button data-act="addExpense" data-id="${p.id}">+ Expense</button><button data-act="archivePayday" data-id="${p.id}">${p.archived?'Restore payday':'Archive payday'}</button></div></div></details>`).join('')}<h2>Debts</h2>${db.debts.filter(d=>showArchived||!d.archived).map(d=>`<section class="card"><div class="fields"><label>Name<input data-kind="debt" data-id="${d.id}" data-field="name" value="${esc(d.name)}"></label><label>Total owed${moneyField(d.totalCents,`data-kind="debt" data-id="${d.id}" data-field="totalCents"`)}</label><label>Already paid${moneyField(d.paidCents,`data-kind="debt" data-id="${d.id}" data-field="paidCents"`)}</label></div><p><b>Remaining: ${fmt(Math.max(0,d.totalCents-d.paidCents))}</b></p><p class="subtle">Manual paid total is authoritative; payday “Dad” expenses are not added to it again.</p><button data-act="debtPayment" data-id="${d.id}">+ Record repayment</button>${(d.entries||[]).map(e=>`<p class="entry">${esc(e.date)} · ${fmt(e.amountCents)} · ${esc(e.note)}</p>`).join('')}<button data-act="archiveDebt" data-id="${d.id}">${d.archived?'Restore':'Archive'}</button></section>`).join('')}<button data-act="addDebt">+ Debt</button><h2>Savings goals</h2><p class="subtle">Savings balances change only when you record a deposit, withdrawal, or correction. Historical V9 planned allocations are not assumed deposited.</p>${db.savings.filter(s=>showArchived||!s.archived).map(s=>{let bal=s.openingCents==null?null:s.openingCents+s.entries.reduce((a,e)=>a+e.amountCents,0);return `<section class="card"><div class="fields"><label>Goal name<input data-kind="saving" data-id="${s.id}" data-field="name" value="${esc(s.name)}"></label><label>Target (optional)<input type="number" step="0.01" data-kind="saving" data-id="${s.id}" data-field="targetCents" value="${s.targetCents==null?'':dollars(s.targetCents)}"></label><label>Opening saved balance (optional)<input type="number" step="0.01" data-kind="saving" data-id="${s.id}" data-field="openingCents" value="${s.openingCents==null?'':dollars(s.openingCents)}"></label></div><p><b>Saved: ${bal==null?'Not confirmed':fmt(bal)}</b>${s.targetCents!=null&&bal!=null?' · '+Math.max(0,Math.min(100,Math.round(bal/s.targetCents*100)))+'% of goal':''}</p>${s.legacyNote?`<p class="warn">${esc(s.legacyNote)}</p>`:''}<div class="toolbar"><button data-act="savingEntry" data-id="${s.id}">+ Deposit / withdrawal</button><button data-act="archiveSaving" data-id="${s.id}">${s.archived?'Restore':'Archive'}</button></div>${s.entries.map(e=>`<p class="entry">${esc(e.date)} · ${esc(e.note||e.type)} · ${fmt(e.amountCents)}</p>`).join('')}</section>`}).join('')}<button data-act="addSaving">+ Savings goal</button>`}
function recurDates(r,start,end){let arr=[],d=r.start,count=0;if(!safeDate(d))return arr;while(d<=end&&count<1200){if(d>=start&&(!r.until||d<=r.until))arr.push(d);count++;if(r.freq==='daily')d=plusDays(d,r.every||1);else if(r.freq==='weekly')d=plusDays(d,7*(r.every||1));else if(r.freq==='biweekly')d=plusDays(d,14*(r.every||1));else if(r.freq==='monthly')d=plusMonths(d,r.every||1);else if(r.freq==='yearly')d=plusMonths(d,12*(r.every||1));else break;if(r.until&&d>r.until)break;}return arr;}
function eventsFor(start,end){let arr=[];for(let p of db.paydays){if(p.archived)continue;if(p.isoDate&&p.isoDate>=start&&p.isoDate<=end)arr.push({id:'pay-'+p.id,date:p.isoDate,name:p.label+' payday',amount:p.incomeCents,type:'income',status:p.completed?'paid':'unpaid',paydayId:p.id});for(let e of p.expenses){if(e.archived||!e.dueDate||e.dueDate<start||e.dueDate>end)continue;arr.push({id:e.id,date:e.dueDate,name:e.name,amount:e.amountCents,type:'expense',status:e.status,paydayId:p.id})}}for(let t of db.transactions){if(t.archived||t.date<start||t.date>end)continue;arr.push({...t,id:t.id})}for(let r of db.recurrences){if(r.archived)continue;for(let date of recurDates(r,start,end)){let override=r.overrides?.[date];if(override?.deleted)continue;arr.push({id:r.id+'@'+date,date,name:override?.name??r.name,amount:override?.amountCents??r.amountCents,type:override?.type??r.type,status:override?.status??'unpaid',recurrenceId:r.id})}}return arr.sort((a,b)=>a.date.localeCompare(b.date))}
function monthGrid(){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),offset=first.getDay(),events=eventsFor(month+'-01',month+'-31');let cells='';for(let i=0;i<offset;i++)cells+='<div class="day empty"></div>';for(let d=1;d<=days;d++){let date=month+'-'+String(d).padStart(2,'0'),ev=events.filter(x=>x.date===date);cells+=`<button class="day ${date===selected?'selected':''} ${date===localToday()?'today':''}" data-act="selectDay" data-date="${date}"><b>${d}</b><small>${ev.length?ev.length+' item'+(ev.length>1?'s':''):''}</small></button>`}return cells}
function calendar(){let e=eventsFor(selected,selected),end=plusDays(db.bank.date||localToday(),180),forecast=null;if(db.bank.amount!=null&&safeDate(db.bank.date)){forecast=db.bank.amount;for(let ev of eventsFor(plusDays(db.bank.date,1),end)){if(ev.status==='skipped')continue;forecast+=ev.type==='income'?ev.amount:-ev.amount}}return `<section class="card"><h2>Bank forecast</h2><p class="subtle">Enter your real bank balance and its date. Forecast uses future dated entries only; paid/unpaid statuses remain visible. No bank connection.</p><div class="fields"><label>Actual bank balance<input type="number" step="0.01" data-kind="bank" data-field="amount" value="${db.bank.amount==null?'':dollars(db.bank.amount)}"></label><label>Balance as of<input type="date" data-kind="bank" data-field="date" value="${esc(db.bank.date)}"></label></div><p>Projected through ${esc(end)}: <b>${forecast==null?'Enter balance and date':fmt(forecast)}</b></p><p class="warn">Only transactions with confirmed dates are forecast. Savings transfers are not automatically counted. Transactions already included in your starting bank balance must not be added again.</p></section><div class="monthbar"><button data-act="prevMonth">‹</button><h2>${new Date(month+'-15T12:00:00').toLocaleDateString('en-CA',{month:'long',year:'numeric'})}</h2><button data-act="nextMonth">›</button><button data-act="today">Today</button></div><div class="calendar"><div class="weekdays">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(s=>'<span>'+s+'</span>').join('')}</div><div class="days">${monthGrid()}</div></div><section class="card"><h2>${esc(selected)}</h2><div class="toolbar"><button data-act="addTransaction">+ Transaction</button><button data-act="addRecurring">+ Recurring rule</button></div>${e.length?e.map(t=>`<div class="event"><div><b>${esc(t.name)}</b><small>${esc(t.status||'unpaid')} · ${esc(t.type)}</small></div><b>${t.type==='income'?'+':'−'}${fmt(t.amount)}</b>${t.paydayId?`<button class="tiny" data-act="goPayday" data-id="${t.paydayId}">Budget</button>`:`<button class="tiny" data-act="editEvent" data-id="${t.id}">Edit</button>`}</div>`).join(''):'<p class="subtle">No dated transactions for this day.</p>'}</section><section class="card"><h2>Recurring rules</h2>${db.recurrences.filter(r=>!r.archived).map(r=>`<div class="event"><div><b>${esc(r.name)}</b><small>${esc(r.freq)} every ${r.every||1} · ${esc(r.start)}</small></div><b>${fmt(r.amountCents)}</b><button class="tiny" data-act="editRule" data-id="${r.id}">Edit</button></div>`).join('')||'<p class="subtle">None yet.</p>'}</section><section class="card"><h2>Due dates needed</h2><p class="subtle">These imported budget expenses have no individual due date, so they are excluded from the dated bank forecast.</p><b>${db.paydays.reduce((n,p)=>n+p.expenses.filter(e=>!e.archived&&!e.dueDate).length,0)} expenses</b></section>`}
function settingFor(date){return [...db.work.settings].sort((a,b)=>b.effective.localeCompare(a.effective)).find(s=>s.effective<=date)||db.work.settings[0]}
function hoursPaid(d){if(d.off)return 0;let s=settingFor(d.date);return d.paidHours==null?Number(s.scheduled):Number(d.paidHours)}
function dayGross(d){if(d.off)return 0;let s=settingFor(d.date),base=hoursPaid(d)*Number(d.rate??s.rate);return cents(base)+d.extras.filter(e=>e.status==='approved').reduce((n,e)=>n+cents(e.hours*e.rate),0)+cents(d.holidayPay||0)}
function weekStart(date){let d=new Date(date+'T12:00:00'),offset=(d.getDay()+6)%7;return plusDays(date,-offset)}
function payPeriod(date){let anchor=db.work.payAnchor||'2026-10-02';let diff=Math.floor((new Date(date+'T12:00:00')-new Date(anchor+'T12:00:00'))/864e5);let n=Math.floor(diff/14);return {start:plusDays(anchor,n*14),end:plusDays(anchor,n*14+13)}}

function segmentMinutes(a,b){if(!a||!b)return null;const x=a.split(':').map(Number),y=b.split(':').map(Number);let n=y[0]*60+y[1]-x[0]*60-x[1];return n>=0?n:null}
function actualForDay(d){if(!d)return null;if(Array.isArray(d.segments)&&d.segments.length){let mins=0,valid=0;for(const s of d.segments){let n=segmentMinutes(s.start,s.end);if(n!==null){mins+=n;valid++}}return valid?Math.round(mins/60*100)/100:null}return d.actualHours??(d.start&&d.end?Math.round(segmentMinutes(d.start,d.end)/60*100)/100:null)}
function dayName(iso){return new Date(iso+'T12:00:00').toLocaleDateString('en-CA',{weekday:'short'})}
function timeSheet(){const days=Array.from({length:7},(_,i)=>plusDays(workWeek,i));const rows=days.map(date=>{let d=db.work.days.find(x=>x.date===date),h=actualForDay(d);return `<button type="button" class="week-day ${selectedWorkDay===date?'selected':''}" data-act="pickWorkDay" data-date="${date}"><span>${dayName(date)} <small>${date.slice(5)}</small></span><span>${d?(d.off?'OFF':(h==null?'Times needed':h.toFixed(2)+'h actual')):'Not logged'}</span><b>${d?fmt(dayGross(d)):'—'}</b></button>`}).join('');let d=db.work.days.find(x=>x.date===selectedWorkDay);let h=actualForDay(d);let weekGross=days.reduce((sum,date)=>sum+db.work.days.filter(x=>x.date===date).reduce((n,x)=>n+dayGross(x),0),0);let content=d?`<div class="fields"><label>Day type<select data-kind="workday" data-id="${d.id}" data-field="off">${['','sick','vacation','school closure','holiday','unpaid','custom'].map(v=>`<option ${d.off===v?'selected':''} value="${v}">${v||'Worked'}</option>`).join('')}</select></label><label>Paid route hours<input type="number" step="0.01" data-kind="workday" data-id="${d.id}" data-field="paidHours" value="${d.paidHours??settingFor(d.date).scheduled}"></label></div>${d.off?'<p class="subtle">Day off: route pay is excluded. Change Day type to Worked to log time.</p>':`<h3>Clock-in / clock-out sessions</h3><p class="subtle">Enter each driving session separately, e.g. morning and afternoon. Times use your phone’s time picker. Paid route hours remain separate from actual clocked hours.</p>${(d.segments||[]).map((s,i)=>`<div class="clock-row"><span>Session ${i+1}</span><label>In<input aria-label="Clock in for session ${i+1}" type="time" data-kind="segment" data-id="${d.id}" data-index="${i}" data-field="start" value="${esc(s.start||'')}"></label><label>Out<input aria-label="Clock out for session ${i+1}" type="time" data-kind="segment" data-id="${d.id}" data-index="${i}" data-field="end" value="${esc(s.end||'')}"></label><button data-act="removeSegment" data-id="${d.id}" data-index="${i}" type="button">Remove</button></div>`).join('')}<div class="toolbar"><button type="button" data-act="addSegment" data-id="${d.id}">+ Add clock session</button></div><p class="subtle">Actual time: <b>${h==null?'Not entered':h.toFixed(2)+' hours'}</b> · Paid route time: <b>${hoursPaid(d).toFixed(2)} hours</b></p><label>Manual actual hours (optional, when no sessions are entered)<input type="number" step="0.01" data-kind="workday" data-id="${d.id}" data-field="actualHours" value="${d.actualHours??''}"></label>`}<p><b>Estimated approved gross: ${fmt(dayGross(d))}</b></p><div class="toolbar"><button type="button" data-act="addExtra" data-id="${d.id}">+ Extra work</button></div>${d.extras.map(e=>`<div class="expense"><select data-kind="extra" data-day="${d.id}" data-id="${e.id}" data-field="type">${['cover','charter','maintenance','training','misc'].map(v=>`<option ${e.type===v?'selected':''}>${v}</option>`).join('')}</select><input aria-label="Extra hours" type="number" step="0.01" data-kind="extra" data-day="${d.id}" data-id="${e.id}" data-field="hours" value="${e.hours}"><input aria-label="Extra hourly rate" type="number" step="0.01" data-kind="extra" data-day="${d.id}" data-id="${e.id}" data-field="rate" value="${e.rate}"><select data-kind="extra" data-day="${d.id}" data-id="${e.id}" data-field="status">${['pending','approved','rejected'].map(v=>`<option ${e.status===v?'selected':''}>${v}</option>`).join('')}</select><button type="button" data-act="removeExtra" data-day="${d.id}" data-id="${e.id}">Remove</button></div>`).join('')}`:`<p class="subtle">No work entry for ${selectedWorkDay}. Workdays are not automatically created.</p><button type="button" class="primary" data-act="createSelectedWorkDay">+ Log this day</button>`;return `<section class="card"><h2>Weekly timesheet</h2><div class="toolbar"><button type="button" data-act="previousWorkWeek">← Previous</button><button type="button" data-act="currentWorkWeek">This week</button><button type="button" data-act="nextWorkWeek">Next →</button></div><p class="subtle">${days[0]} to ${days[6]} · Approved gross <b>${fmt(weekGross)}</b></p><div class="week-grid">${rows}</div><div class="day-editor"><h3>${dayName(selectedWorkDay)}, ${selectedWorkDay}</h3>${content}</div></section>`}

function work(){let ds=[...db.work.days].sort((a,b)=>b.date.localeCompare(a.date));db.work.paystubs??={};let gross=ds.reduce((s,d)=>s+dayGross(d),0),pending=ds.reduce((s,d)=>s+d.extras.filter(e=>e.status==='pending').reduce((a,e)=>a+cents(e.hours*e.rate),0),0);return `${timeSheet()}<section class="stats"><div class="stat"><small>Logged days</small><strong>${ds.length}</strong></div><div class="stat"><small>Approved gross</small><strong>${fmt(gross)}</strong></div><div class="stat"><small>Pending extras</small><strong>${fmt(pending)}</strong></div><div class="stat"><small>Paid route hours</small><strong>${ds.reduce((n,d)=>n+hoursPaid(d),0).toFixed(2)}</strong></div></section><section class="card"><h2>Route schedule history</h2><p class="subtle">Changes apply from their effective date. Existing day overrides are kept.</p>${db.work.settings.sort((a,b)=>a.effective.localeCompare(b.effective)).map((s,i)=>`<div class="setting"><label>Effective<input type="date" data-kind="setting" data-index="${i}" data-field="effective" value="${esc(s.effective)}"></label><label>Route<input data-kind="setting" data-index="${i}" data-field="route" value="${esc(s.route)}"></label><label>Paid hours<input type="number" step="0.25" data-kind="setting" data-index="${i}" data-field="scheduled" value="${s.scheduled}"></label><label>$/hour<input type="number" step="0.01" data-kind="setting" data-index="${i}" data-field="rate" value="${s.rate}"></label></div>`).join('')}<button data-act="addSetting">+ Effective-date change</button></section><section class="card"><h2>Log work</h2><p class="subtle">Workdays are never auto-created. Route pay uses scheduled/approved hours, even if driving finishes early. Actual worked hours are separate.</p><div class="toolbar"><button data-act="addWork">+ Workday / day off</button><button data-act="duplicateWork">Duplicate previous day</button><button data-act="pdfTimesheet">Download PDF timesheet</button></div><label>Payroll anchor date<input type="date" data-kind="workconfig" data-field="payAnchor" value="${esc(db.work.payAnchor)}"></label></section><section class="card"><h2>Weekly and biweekly totals</h2>${[...new Set(ds.map(d=>weekStart(d.date)))].sort().reverse().map(w=>`<p class="entry">Week of ${w}: <b>${fmt(ds.filter(d=>weekStart(d.date)===w).reduce((s,d)=>s+dayGross(d),0))}</b></p>`).join('')||'<p class="subtle">No workdays logged yet.</p>'}${[...new Set(ds.map(d=>payPeriod(d.date).start))].sort().reverse().map(w=>{let expected=ds.filter(d=>payPeriod(d.date).start===w).reduce((s,d)=>s+dayGross(d),0),actual=db.work.paystubs[w];return `<div class="entry"><b>Pay period ${w} to ${plusDays(w,13)}</b><p>Expected gross: ${fmt(expected)}</p><label>Paystub actual gross ($, optional)<input type="number" step="0.01" data-kind="paystub" data-id="${w}" value="${actual==null?'':dollars(actual)}"></label><p>Difference: ${actual==null?'Not entered':fmt(actual-expected)}</p></div>`}).join('')}</section><h2>Workday log</h2>${(db.work.archive||[]).length?`<button data-act="restoreWork">Restore archived day (${db.work.archive.length})</button>`:''}${ds.map(d=>{let s=settingFor(d.date);return `<section class="card"><div class="event"><div><b>${esc(d.date)} · ${esc(d.off||'Route '+s.route)}</b><small>Actual ${actualForDay(d)??'—'} h · Paid ${hoursPaid(d)} h</small></div><b>${fmt(dayGross(d))}</b></div><div class="fields"><label>Date<input type="date" data-kind="workday" data-id="${d.id}" data-field="date" value="${esc(d.date)}"></label><label>Day off reason<select data-kind="workday" data-id="${d.id}" data-field="off">${['','sick','vacation','school closure','holiday','unpaid','custom'].map(v=>`<option ${d.off===v?'selected':''} value="${v}">${v||'Worked'}</option>`).join('')}</select></label><label>Actual hours<input type="number" step="0.01" placeholder="Optional" data-kind="workday" data-id="${d.id}" data-field="actualHours" value="${d.actualHours??''}"></label><label>Paid hours override<input type="number" step="0.01" placeholder="Schedule default" data-kind="workday" data-id="${d.id}" data-field="paidHours" value="${d.paidHours??''}"></label><label>Route rate override<input type="number" step="0.01" placeholder="Schedule default" data-kind="workday" data-id="${d.id}" data-field="rate" value="${d.rate??''}"></label><label>Holiday pay ($)<input type="number" step="0.01" data-kind="workday" data-id="${d.id}" data-field="holidayPay" value="${d.holidayPay||0}"></label><label>Actual start<input type="time" data-kind="workday" data-id="${d.id}" data-field="start" value="${esc(d.start||'')}"></label><label>Actual end<input type="time" data-kind="workday" data-id="${d.id}" data-field="end" value="${esc(d.end||'')}"></label></div><h3>Extra work</h3>${d.extras.map(e=>`<div class="expense"><select data-kind="extra" data-day="${d.id}" data-id="${e.id}" data-field="type">${['cover','charter','maintenance','training','misc'].map(v=>`<option ${e.type===v?'selected':''}>${v}</option>`).join('')}</select><input type="number" step="0.01" aria-label="Hours" data-kind="extra" data-day="${d.id}" data-id="${e.id}" data-field="hours" value="${e.hours}"><input type="number" step="0.01" aria-label="Hourly rate" data-kind="extra" data-day="${d.id}" data-id="${e.id}" data-field="rate" value="${e.rate}"><select data-kind="extra" data-day="${d.id}" data-id="${e.id}" data-field="status">${['pending','approved','rejected'].map(v=>`<option ${e.status===v?'selected':''}>${v}</option>`).join('')}</select><button class="tiny" data-act="removeExtra" data-day="${d.id}" data-id="${e.id}">Remove</button></div>`).join('')}<div class="toolbar"><button data-act="addExtra" data-id="${d.id}">+ Extra work</button><button data-act="removeWork" data-id="${d.id}">Archive day</button></div></section>`}).join('')}`}
function render(){try{const openPaydays=new Set([...document.querySelectorAll('details[data-payid][open]')].map(e=>e.dataset.payid));$('content').innerHTML=page==='budget'?budget():page==='calendar'?calendar():work();if(page==='budget'&&openPaydays.size){document.querySelectorAll('details[data-payid]').forEach(d=>d.open=openPaydays.has(d.dataset.payid))}document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page)});$('tabTitle').textContent=page==='budget'?'Budget':page==='calendar'?'Calendar':'Work Hours';$('loaded').textContent=`Data loaded: ${db.paydays.length} paydays · ${db.paydays.reduce((n,p)=>n+p.expenses.length,0)} expenses`;updateStorage();}catch(e){$('content').innerHTML='<section class="card"><h2>Display error</h2><p class="warn">'+esc(e.message)+'</p><button data-act="export">Export backup</button></section>';console.error(e)}}
function change(el){let {kind,id,field,pay,index,day}=el.dataset;if(!kind)return;if(kind==='segment'){let d=db.work.days.find(x=>x.id===id);if(!d||!d.segments?.[Number(index)])return;d.segments[Number(index)][field]=el.value;d.actualHours=actualForDay(d);save();render();return}let o;if(kind==='pay')o=byId(id);if(kind==='expense')o=byId(pay)?.expenses.find(e=>e.id===id);if(kind==='debt')o=db.debts.find(d=>d.id===id);if(kind==='saving')o=db.savings.find(s=>s.id===id);if(kind==='bank')o=db.bank;if(kind==='setting')o=db.work.settings[Number(index)];if(kind==='workday')o=db.work.days.find(d=>d.id===id);if(kind==='extra')o=db.work.days.find(d=>d.id===day)?.extras.find(e=>e.id===id);if(kind==='workconfig')o=db.work;if(kind==='paystub'){db.work.paystubs??={};db.work.paystubs[id]=el.value===''?null:cents(el.value);save();render();return}if(!o)return;let v=el.type==='checkbox'?el.checked:el.value;if(['incomeCents','amountCents','actualAvailableCents','totalCents','paidCents','targetCents','openingCents'].includes(field))v=v===''?null:cents(v);else if(['scheduled','rate','paidHours','actualHours','hours','holidayPay'].includes(field))v=v===''?null:Number(v);else if(field==='off')v=v||null;else if(field==='dueDate'||field==='isoDate')v=v||null;o[field]=v;if(kind==='workday'&&(field==='start'||field==='end')&&o.start&&o.end){let [h,m]=o.start.split(':').map(Number),[h2,m2]=o.end.split(':').map(Number),mins=(h2*60+m2)-(h*60+m);if(mins>=0)o.actualHours=Math.round(mins/60*100)/100}save();render();}
function ask(label,def=''){let v=prompt(label,def);return v==null?null:v.trim()}
function askAmount(label,def='0'){let v=ask(label,def);if(v===null)return null;if(v===''||!Number.isFinite(Number(v)))return null;return cents(v)}
function actions(el){let {act,id,pay,date,day}=el.dataset;if(!act)return;if(act==='previousWorkWeek'||act==='nextWorkWeek'||act==='currentWorkWeek'){workWeek=act==='currentWorkWeek'?weekStart(localToday()):plusDays(workWeek,act==='previousWorkWeek'?-7:7);selectedWorkDay=workWeek;render();return}if(act==='pickWorkDay'){selectedWorkDay=date;render();return}if(act==='createSelectedWorkDay'){if(db.work.days.some(x=>x.date===selectedWorkDay)){render();return}const s=settingFor(selectedWorkDay);db.work.days.push({id:uid(),date:selectedWorkDay,off:null,actualHours:null,paidHours:Number(s.scheduled),rate:Number(s.rate),start:'',end:'',holidayPay:0,segments:[{start:'',end:''},{start:'',end:''}],extras:[]});save();render();return}if(act==='addSegment'||act==='removeSegment'){let d=db.work.days.find(x=>x.id===id);if(!d)return;d.segments??=[];if(act==='addSegment')d.segments.push({start:'',end:''});else d.segments.splice(Number(el.dataset.index),1);d.actualHours=actualForDay(d);save();render();return}if(act==='export'){exportBackup();return}if(act==='toggleArchive'){showArchived=!showArchived;render();return}if(act==='addPayday'){let date=ask('Payday date (YYYY-MM-DD)',localToday());if(date===null)return;if(!safeDate(date)){toast('Enter a valid YYYY-MM-DD date',true);return}let amount=askAmount('Take-home income ($)','870');if(amount==null)return;db.paydays.push({id:uid(),label:date,isoDate:date,incomeCents:amount,completed:false,actualAvailableCents:null,legacyAdjustment:0,legacyVet:0,legacyOther:0,archived:false,expenses:[]})}if(act==='addExpense'){let p=byId(id);p.expenses.push({id:uid(),name:'New expense',amountCents:0,status:'unpaid',dueDate:null,archived:false})}if(act==='archiveExpense'){let e=byId(pay).expenses.find(x=>x.id===id);e.archived=!e.archived}if(act==='archivePayday'){let p=byId(id);p.archived=!p.archived}if(act==='addDebt'){db.debts.push({id:uid(),name:'New debt',totalCents:0,paidCents:0,entries:[],archived:false})}if(act==='debtPayment'){let d=db.debts.find(x=>x.id===id),a=askAmount('Repayment amount ($)','0');if(a==null)return;let date=ask('Date YYYY-MM-DD',localToday());if(!safeDate(date))return toast('Invalid date',true);let note=ask('Note (optional)','');d.entries??=[];d.entries.push({id:uid(),amountCents:a,date,note:note||''});d.paidCents+=a}if(act==='archiveDebt'){let d=db.debts.find(x=>x.id===id);d.archived=!d.archived}if(act==='addSaving'){db.savings.push({id:uid(),name:'New savings goal',targetCents:null,openingCents:0,entries:[],archived:false})}if(act==='archiveSaving'){let s=db.savings.find(x=>x.id===id);s.archived=!s.archived}if(act==='savingEntry'){let s=db.savings.find(x=>x.id===id);if(s.openingCents==null){toast('Confirm opening savings balance first',true);return}let type=ask('Type: deposit, withdrawal, or correction','deposit');if(type==null)return;type=type.toLowerCase();if(!['deposit','withdrawal','correction'].includes(type)){toast('Unknown type',true);return}let amount=askAmount(type==='correction'?'Signed correction amount ($)':'Amount ($)','0');if(amount==null)return;let d=ask('Transaction date YYYY-MM-DD',localToday());if(d==null)return;if(!safeDate(d)){toast('Invalid date',true);return}let note=ask('Note (optional)','');s.entries.push({id:uid(),date:d,type,amountCents:type==='withdrawal'?-Math.abs(amount):type==='deposit'?Math.abs(amount):amount,note:note||''})}if(act==='prevMonth'){month=plusMonths(month+'-01',-1).slice(0,7);selected=month+'-01'}if(act==='nextMonth'){month=plusMonths(month+'-01',1).slice(0,7);selected=month+'-01'}if(act==='today'){selected=localToday();month=selected.slice(0,7)}if(act==='selectDay'){selected=date}if(act==='goPayday'){page='budget';setTimeout(()=>{let card=[...document.querySelectorAll('details.card')].find(x=>x.textContent.includes(byId(id)?.label));card?.scrollIntoView({behavior:'smooth'});},50)}if(act==='addTransaction'){let name=ask('Transaction name','New transaction');if(name==null)return;let amount=askAmount('Amount ($)','0');if(amount==null)return;let type=ask('Type: expense or income','expense');if(type==null)return;type=type.toLowerCase();if(!['expense','income'].includes(type)){toast('Invalid type',true);return}db.transactions.push({id:uid(),name,amountCents:amount,type,date:selected,status:'unpaid',archived:false})}if(act==='editEvent'){let isRecurring=id.includes('@');let t=isRecurring?null:db.transactions.find(t=>t.id===id);if(isRecurring){let [rid,occ]=id.split('@'),r=db.recurrences.find(x=>x.id===rid);let scope=ask('Edit this occurrence or this and future? Type: this / future','this');if(scope==null)return;let amount=askAmount('New amount ($)',dollars(r.overrides?.[occ]?.amountCents??r.amountCents));if(amount==null)return;if(scope==='this'){r.overrides??={};let status=ask('Status: unpaid, paid, skipped',r.overrides?.[occ]?.status||'unpaid');if(status==null)return;if(!['unpaid','paid','skipped'].includes(status))return toast('Invalid status',true);r.overrides[occ]={...(r.overrides[occ]||{}),amountCents:amount,status}}else if(scope==='future'){let newRule=clone(r);newRule.id=uid();newRule.start=occ;newRule.amountCents=amount;newRule.overrides={};r.until=plusDays(occ,-1);db.recurrences.push(newRule)}else{toast('Type this or future',true);return}}else if(t){let name=ask('Name',t.name);if(name==null)return;let amount=askAmount('Amount ($)',dollars(t.amountCents));if(amount==null)return;let status=ask('Status: unpaid, paid, skipped',t.status);if(status==null)return;if(!['unpaid','paid','skipped'].includes(status)){toast('Invalid status',true);return}t.name=name;t.amountCents=amount;t.status=status}}if(act==='addRecurring'){let name=ask('Recurring item name','New recurring bill');if(name==null)return;let amount=askAmount('Amount ($)','0');if(amount==null)return;let type=ask('Type: expense or income','expense');if(type==null)return;type=type.toLowerCase();if(!['expense','income'].includes(type))return toast('Invalid type',true);let freq=ask('Frequency: daily, weekly, biweekly, monthly, yearly','monthly');if(freq==null)return;freq=freq.toLowerCase();if(!['daily','weekly','biweekly','monthly','yearly'].includes(freq))return toast('Invalid frequency',true);let every=Number(ask('Repeat every how many '+freq+' intervals?','1'));if(!Number.isInteger(every)||every<1||every>100)return toast('Invalid interval',true);db.recurrences.push({id:uid(),name,amountCents:amount,type,freq,every,start:selected,until:null,overrides:{},archived:false})}if(act==='editRule'){let r=db.recurrences.find(x=>x.id===id);let scope=ask('Type: future (new version from a date), all (edit rule), archive','all');if(scope==null)return;if(scope==='archive'){r.archived=true}else if(scope==='all'){let amount=askAmount('New amount ($)',dollars(r.amountCents));if(amount==null)return;r.amountCents=amount}else if(scope==='future'){let d=ask('Effective date YYYY-MM-DD',selected);if(!safeDate(d)||d<=r.start)return toast('Invalid effective date',true);let amount=askAmount('New amount ($)',dollars(r.amountCents));if(amount==null)return;let next=clone(r);next.id=uid();next.start=d;next.amountCents=amount;next.overrides={};r.until=plusDays(d,-1);db.recurrences.push(next)}else return}if(act==='addSetting'){let effective=ask('Effective date YYYY-MM-DD',localToday());if(!safeDate(effective))return toast('Invalid date',true);let prior=settingFor(effective);db.work.settings.push({...clone(prior),effective})}if(act==='addWork'||act==='duplicateWork'){let prior=[...db.work.days].sort((a,b)=>b.date.localeCompare(a.date))[0],d=ask('Work date YYYY-MM-DD',localToday());if(!safeDate(d))return toast('Invalid date',true);if(db.work.days.some(x=>x.date===d))return toast('Workday already exists; edit it instead',true);let setting=settingFor(d);db.work.days.push(act==='duplicateWork'&&prior?{...clone(prior),id:uid(),date:d,paidHours:Number(setting.scheduled),rate:Number(setting.rate),segments:[{start:'',end:''},{start:'',end:''}],start:'',end:'',actualHours:null,extras:prior.extras.map(e=>({...e,id:uid(),status:'pending'}))}:{id:uid(),date:d,off:null,actualHours:null,paidHours:Number(setting.scheduled),rate:Number(setting.rate),start:'',end:'',holidayPay:0,extras:[]})}if(act==='addExtra'){let d=db.work.days.find(x=>x.id===id);let type=ask('Extra work: cover, charter, maintenance, training, misc','cover');if(type==null)return;type=type.toLowerCase();if(!(type in db.work.extraRates))return toast('Invalid type',true);let hours=ask('Hours','1');if(hours==null||!Number.isFinite(Number(hours))||Number(hours)<0)return toast('Invalid hours',true);d.extras.push({id:uid(),type,hours:Number(hours),rate:db.work.extraRates[type],status:'pending'})}if(act==='removeExtra'){let d=db.work.days.find(x=>x.id===day);d.extras=d.extras.filter(x=>x.id!==id)}if(act==='restoreWork'){let list=db.work.archive||[];let d=list.pop();if(d)db.work.days.push(d)}if(act==='removeWork'){if(!confirm('Archive this workday? It will be retained in the backup.'))return;let d=db.work.days.find(x=>x.id===id);db.work.archive??=[];db.work.archive.push(d);db.work.days=db.work.days.filter(x=>x.id!==id)}if(act==='pdfTimesheet'){exportTimesheet();return}save();render()}
// A self-contained single-page PDF writer: ASCII-safe text, no external libraries or internet.
function pdfEscape(s){return String(s).replace(/[^\x20-\x7e]/g,'?').replace(/[\\()]/g,'\\$&')}
function pdfDocument(lines){let chunks=[],objs=[],offset=0;const add=s=>{objs.push(s);return objs.length};let pages=[];let font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');for(let i=0;i<lines.length;i+=45){let part=lines.slice(i,i+45),stream='BT /F1 10 Tf 45 780 Td 14 TL '+part.map((line,j)=>(j?'T* ':'')+'('+pdfEscape(line)+') Tj').join('\n')+' ET';let content=add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);let page=add(`<< /Type /Page /Parent PARENT /MediaBox [0 0 612 842] /Resources << /Font << /F1 ${font} 0 R >> >> /Contents ${content} 0 R >>`);pages.push(page)}let parent=add(`<< /Type /Pages /Kids [${pages.map(p=>p+' 0 R').join(' ')}] /Count ${pages.length} >>`);for(let p of pages)objs[p-1]=objs[p-1].replace('PARENT',parent+' 0 R');let catalog=add(`<< /Type /Catalog /Pages ${parent} 0 R >>`);let out='%PDF-1.4\n',pos=[0];for(let i=0;i<objs.length;i++){pos.push(out.length);out+=`${i+1} 0 obj\n${objs[i]}\nendobj\n`}let start=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;for(let i=1;i<pos.length;i++)out+=String(pos[i]).padStart(10,'0')+' 00000 n \n';out+=`trailer\n<< /Size ${objs.length+1} /Root ${catalog} 0 R >>\nstartxref\n${start}\n%%EOF`;return new Blob([out],{type:'application/pdf'})}
function exportTimesheet(){let ds=[...db.work.days].sort((a,b)=>a.date.localeCompare(b.date)),lines=['MY BUDGET V10 - WORK TIMESHEET','Generated: '+localToday(),'Gross estimates only; actual take-home pay entered in Budget.',''];for(let d of ds){lines.push(`${d.date}  ${d.off?'OFF '+d.off:'ROUTE '+settingFor(d.date).route}  actual ${actualForDay(d)??'-'}h  paid ${hoursPaid(d)}h  gross ${fmt(dayGross(d))}`);for(let s of (d.segments||[]))if(s.start||s.end)lines.push(`   CLOCK ${s.start||'?'} - ${s.end||'?'}`);for(let e of d.extras)lines.push(`   ${e.type} ${e.hours}h x $${e.rate} - ${e.status}`)}lines.push('','TOTAL APPROVED GROSS: '+fmt(ds.reduce((n,d)=>n+dayGross(d),0)));download('my-budget-work-timesheet-'+localToday()+'.pdf',pdfDocument(lines))}
