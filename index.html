<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest?v=8-iconfix-1">
<title>My Budget</title>
<style>
:root{--bg:#0b1020;--card:#151c2f;--card2:#1b253c;--text:#f6f7fb;--muted:#9da9bd;--line:#2a3652;--accent:#6ea8fe;--good:#65d6a6;--bad:#ff7b7b}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:auto;padding:18px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:26px;margin:0}.sub{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}
.big{font-size:24px;font-weight:750;margin-top:4px}.label{font-size:13px;color:var(--muted)}.section{margin-top:16px}
details{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:9px 0;overflow:hidden}summary{padding:15px;cursor:pointer;list-style:none}
.summary{display:flex;justify-content:space-between;gap:12px}.right{text-align:right}.body{border-top:1px solid var(--line);padding:14px}
.row{display:grid;grid-template-columns:38px minmax(0,1fr) 100px 44px;gap:7px;margin:7px 0;align-items:center;border-radius:12px}.row.skipped{background:#3b1e28;padding:5px}.row.skipped input:not([type=checkbox]){text-decoration:line-through;color:#ff8795}.paidbox{appearance:none;-webkit-appearance:none;width:26px;height:26px;min-height:auto;justify-self:center;border:1px solid #5a4050;border-radius:7px;background:#241821;padding:0;display:grid;place-content:center}.paidbox:checked{background:#3b1e28;border-color:#ff8795}.paidbox:checked:after{content:'✓';color:#ff8795;font-size:18px;font-weight:800;line-height:1}.paidbox:disabled{opacity:.45}.skip.active{background:#3b1e28;color:#ff8795}.moneyrow{display:flex;justify-content:space-between;gap:10px;margin:7px 0}
input{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#0f1628;color:var(--text);padding:9px;font-size:16px}
button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);padding:9px 13px;font-size:14px}button.primary{background:var(--accent);color:#081120;border:0;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}.totalbox{background:var(--card2);border-radius:13px;padding:11px;margin-top:12px}.good{color:var(--good)}.bad{color:var(--bad)}
.progress{height:10px;background:var(--card2);border-radius:999px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--good);width:0}
.done{display:flex;align-items:center;gap:9px;margin-top:12px}.done input{width:22px;min-height:auto;height:22px}.tiny{font-size:12px;color:var(--muted)}
@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:34px minmax(0,1fr) 82px 40px}main{padding-left:10px;padding-right:10px}}
</style>
</head>
<body><main>
<div class="top"><div><h1>My Budget</h1><div class="sub">Changes save automatically on this device</div></div><button id="backup">Backup</button></div>
<div class="grid">
 <div class="card"><div class="label">Total income</div><div class="big" id="allIncome">$0.00</div></div>
 <div class="card"><div class="label">Total left over</div><div class="big" id="allLeft">$0.00</div></div>
</div>
<div class="card section">
 <div class="moneyrow"><div><b>Dad payoff</b><div class="label" id="dadText"></div></div><b id="dadPct"></b></div>
 <div class="progress"><div class="bar" id="dadBar"></div></div>
</div>
<div class="section"><b>Payday plan</b><div class="tiny">Tap a payday. You can edit every amount and expense.</div><div id="days"></div></div>
<div class="grid section">
 <div class="card"><div class="label">Future vet savings</div><div class="big" id="vetTotal">$0.00</div></div>
 <div class="card"><div class="label">Dad paid</div><div class="big" id="dadPaid">$0.00</div></div>
</div>
<div class="section actions"><button id="addPayday">+ Add payday</button><button id="restore">Import backup</button><button id="reset">Reset original plan</button></div>
<input type="file" id="file" accept="application/json" hidden>
</main>
<script>
const KEY='amanda-budget-v1', DAD_TOTAL=910;
const original=[
{date:'Sept 29',income:1315,done:false,vet:0,other:0,items:[['Car',400.30],['Insurance',416.50],['Gas',100],['Vet bill',300],['BMO',17.95],['ChatGPT',33]]},
{date:'Oct 2',income:870,done:false,vet:0,other:0,items:[['YouTube',14.68],['Partial car / insurance',272.20],['Google storage',4.41],['ChatGPT',33],['Dad',130],['Gas',100]]},
{date:'Oct 16',income:870,done:false,vet:0,other:0,items:[['Car',272.20],['Dad',130],['Scotiabank',16.95],['Gas',100]]},
{date:'Oct 30',income:870,done:false,vet:0,other:0,items:[['Car',272.20],['Dad',130],['YouTube',14.68],['Google storage',4.51],['ChatGPT',33],['BMO',17.95],['Gas',100]]},
{date:'Nov 13',income:870,done:false,vet:0,other:0,items:[['Dad',130],['Car',408.30],['Gas',100]]},
{date:'Nov 27',income:870,done:false,vet:0,other:0,items:[['Gas',100],['Scotiabank',16.95],['Google storage',4.51],['ChatGPT',33],['Dad',130],['Car',408.30],['BMO',17.95]]},
{date:'Dec 11',income:870,done:false,vet:0,other:0,items:[['YouTube',14.68],['Dad',130],['Car',408.30],['Gas',100]]},
{date:'Dec 25',income:870,done:false,vet:0,other:0,items:[['Scotiabank',16.95],['Google storage',4.51],['ChatGPT',33],['Dad',130],['Car',408.30],['BMO',17.95],['Gas',100]]}
].map(d=>({...d,items:d.items.map(x=>({n:x[0],a:x[1],paid:false,skipped:false}))}));
const clone=x=>JSON.parse(JSON.stringify(x));
const n=v=>Math.max(0,Number(v)||0);
const signed=v=>Number.isFinite(Number(v))?Number(v):0;
const cash=v=>(v<0?'−$'+Math.abs(v).toFixed(2):'$'+v.toFixed(2));
let data;
try{
  const saved=JSON.parse(localStorage.getItem(KEY));
  data=(Array.isArray(saved) && saved.length>0) ? saved : clone(original);
}catch(e){
  data=clone(original);
}
data=data.map(d=>({...d,actualAvailable:(d.actualAvailable===null||d.actualAvailable===undefined||d.actualAvailable==='')?'':n(d.actualAvailable),items:(d.items||[]).map(x=>({...x,paid:!!x.paid,skipped:!!x.skipped}))}));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){
 const host=document.querySelector('#days');host.innerHTML='';let ai=0,al=0,vet=0,dp=0;
 data.forEach((d,i)=>{
   const base=d.items.reduce((s,x)=>s+(x.skipped?0:n(x.a)),0), p=base+n(d.vet)+n(d.other), calculated=n(d.income)-p;
const hasActual=d.actualAvailable!==''&&d.actualAvailable!==null&&d.actualAvailable!==undefined;
const left=hasActual?n(d.actualAvailable):calculated;
const difference=hasActual?left-calculated:0;
   ai+=n(d.income);al+=left;vet+=n(d.vet);d.items.forEach(x=>{if(x.paid&&!x.skipped&&x.n.trim().toLowerCase()==='dad')dp+=n(x.a)});
   const el=document.createElement('details');
   el.innerHTML=`<summary><div class="summary"><div><b>${esc(d.date)}</b><div class="label">Pay ${cash(n(d.income))} · Planned ${cash(p)}</div></div><div class="right"><div class="label">REMAINING</div><b class="${left<0?'bad':'good'}">${cash(left)}</b></div></div></summary>
   <div class="body">
   <label class="label">Pay / income<input data-k="income" data-i="${i}" type="number" min="0" step=".01" value="${n(d.income).toFixed(2)}"></label>
   <div style="margin-top:12px"><b>Expenses</b>${d.items.map((x,j)=>`<div class="row ${x.skipped?'skipped':''}"><input class="paidbox" aria-label="Paid or put aside" data-k="paid" data-i="${i}" data-j="${j}" type="checkbox" ${x.paid?'checked':''} ${x.skipped?'disabled':''}><input data-k="name" data-i="${i}" data-j="${j}" value="${escAttr(x.n)}"><input data-k="amount" data-i="${i}" data-j="${j}" type="number" min="0" step=".01" value="${n(x.a).toFixed(2)}"><button class="skip ${x.skipped?'active':''}" data-skip="${i},${j}" aria-label="Cannot pay this expense">⊘</button></div>`).join('')}<button data-add="${i}">+ Add expense</button></div>
   <div style="margin-top:12px"><label class="label">Future vet savings<input data-k="vet" data-i="${i}" type="number" min="0" step=".01" value="${n(d.vet).toFixed(2)}"></label></div>
   <div style="margin-top:9px"><label class="label">Other / non-recurring spending<input data-k="other" data-i="${i}" type="number" min="0" step=".01" value="${n(d.other).toFixed(2)}"></label></div>
   <div style="margin-top:9px"><label class="label">Actual available balance <span class="tiny">(leave blank for calculated)</span><input data-k="actualAvailable" data-i="${i}" type="number" min="0" step=".01" inputmode="decimal" placeholder="${calculated.toFixed(2)}" value="${hasActual?n(d.actualAvailable).toFixed(2):''}"></label>${hasActual?`<div class="tiny" style="margin-top:6px">Calculated: ${cash(calculated)} · Difference: <span class="${difference<0?'bad':difference>0?'good':''}">${difference>0?'+':''}${cash(difference)}</span></div>`:''}</div><div class="totalbox"><div class="moneyrow"><span>Expense total</span><b>${cash(base)}</b></div><div class="moneyrow"><span>Total planned</span><b>${cash(p)}</b></div><div class="moneyrow"><span>Available</span><b class="${left<0?'bad':'good'}">${cash(left)}</b></div></div>
   <label class="done"><input data-k="done" data-i="${i}" type="checkbox" ${d.done?'checked':''}> Payday completed</label>
   <div class="actions" style="margin-top:10px"><button data-remove-payday="${i}">Delete payday</button></div>
   </div>`;host.appendChild(el);
 });
 dp=Math.min(DAD_TOTAL,dp);const rem=Math.max(0,DAD_TOTAL-dp),pct=Math.min(100,Math.round(dp/DAD_TOTAL*100));
 allIncome.textContent=cash(ai);allLeft.textContent=cash(al);vetTotal.textContent=cash(vet);dadPaid.textContent=cash(dp);
 dadText.textContent=`${cash(dp)} paid · ${cash(rem)} remaining`;dadPct.textContent=pct+'%';dadBar.style.width=pct+'%';bind();
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function escAttr(s){return esc(s).replace(/"/g,'&quot;')}
function rerenderKeeping(el,fn){const det=el.closest('details'),idx=[...document.querySelectorAll('#days>details')].indexOf(det),open=det?.open;fn();save();render();if(open&&idx>=0&&document.querySelectorAll('#days>details')[idx])document.querySelectorAll('#days>details')[idx].open=true}
function bind(){
 document.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('change',e=>rerenderKeeping(e.target,()=>{
   const i=+e.target.dataset.i,k=e.target.dataset.k,j=+e.target.dataset.j;
   if(k==='income'||k==='vet'||k==='other')data[i][k]=n(e.target.value);if(k==='actualAvailable')data[i].actualAvailable=e.target.value.trim()===''?'':n(e.target.value);
   if(k==='done')data[i].done=e.target.checked;if(k==='paid')data[i].items[j].paid=e.target.checked;
   if(k==='name')data[i].items[j].n=e.target.value.trim()||'Expense';
   if(k==='amount')data[i].items[j].a=n(e.target.value);
 })));
 document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',e=>rerenderKeeping(e.currentTarget,()=>data[+e.currentTarget.dataset.add].items.push({n:'New expense',a:0}))));
 document.querySelectorAll('[data-skip]').forEach(b=>b.addEventListener('click',e=>{let [i,j]=e.currentTarget.dataset.skip.split(',').map(Number);rerenderKeeping(e.currentTarget,()=>{data[i].items[j].skipped=!data[i].items[j].skipped;if(data[i].items[j].skipped)data[i].items[j].paid=false})}));
 document.querySelectorAll('[data-remove-payday]').forEach(b=>b.addEventListener('click',e=>{if(confirm('Delete this payday?'))rerenderKeeping(e.currentTarget,()=>data.splice(+e.currentTarget.dataset.removePayday,1))}));
}
addPayday.addEventListener('click',()=>{data.push({date:'New payday',income:0,done:false,vet:0,other:0,actualAvailable:'',items:[]});save();render();const ds=document.querySelectorAll('#days>details');ds[ds.length-1].open=true});
backup.addEventListener('click',()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='budget-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
restore.addEventListener('click',()=>file.click());
file.addEventListener('change',async()=>{try{const x=JSON.parse(await file.files[0].text());if(!Array.isArray(x))throw 0;data=x;save();render();alert('Backup imported.')}catch(e){alert('That backup file could not be read.')}file.value=''});
reset.addEventListener('click',()=>{if(confirm('Reset everything to the original plan?')){data=clone(original);save();render()}});
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
